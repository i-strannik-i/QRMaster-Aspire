<!DOCTYPE html>
<html lang="ru"><head><meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>QRМастер Aspire 1.1.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',Arial,sans-serif;color:#23354a;background:#f0f3f7}
.header{background:#22394e;color:white;padding:15px 22px}.header h1{margin:0;font-size:24px}
main{display:block;padding:16px 22px}label{display:block;margin:0 0 6px;font-weight:600}input{padding:9px;border:1px solid #aebdca;background:white;color:#23354a;font:15px 'Segoe UI',Arial;width:100%;margin-bottom:13px}
#cutter{width:160px}.note{font-size:12px;line-height:1.45;color:#4c647a;margin:0 0 14px}
button{border:1px solid #aebdca;background:white;color:#23354a;padding:9px 16px;font:14px 'Segoe UI',Arial;cursor:pointer}#ButtonOK{background:#126d92;border-color:#126d92;color:white;font-weight:600;margin-right:8px}
footer{font-size:11px;line-height:1.4;color:#5b7083;padding-top:12px}#OpenUpdate{display:none;padding:4px 8px;font-size:12px;margin-top:5px}#update_available{display:none}
</style><script type="text/javascript">
setInterval(function(){var el=document.getElementById('update_available');if(el){document.getElementById('OpenUpdate').style.display=el.innerText==='1'?'inline-block':'none';}},250);
</script></head><body>
<div class="header"><h1>QRМастер <span style="font-size:12px;font-weight:normal">ASPIRE · 1.1.0</span></h1></div>
<main><label for="url">Ссылка</label><input id="url" type="text" placeholder="https://example.com" maxlength="4000">
<label for="cutter">Диаметр фрезы, мм</label><input id="cutter" type="text">
<p class="note">Размер рассчитывается автоматически под фрезу с запасом 10%. Квадратные векторы — слой QR_SQUARES, обработка Pocket.</p>
<button type="button" id="ButtonOK">Создать QR</button><button type="button" id="ButtonCancel">Отмена</button>
<footer><span id="update_status"></span><span id="update_available"></span><br><button type="button" class="LuaButton" id="OpenUpdate">Обновить</button></footer>
</main></body></html>
